<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario Interactivo · IoT en Entornos Educativos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4ff;
            --surface: #ffffff;
            --text: #1a1f3a;
            --text-secondary: #3a4070;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #0ea5e9;
            --success: #10b981;
            --success-light: #d1fae5;
            --success-border: #34d399;
            --error: #ef4444;
            --error-light: #fee2e2;
            --error-border: #f87171;
            --border: #dbe0ee;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.05);
            --radius: 12px;
            --radius-xl: 20px;
            --transition: 0.2s ease;
            --font: 'Inter', system-ui, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: linear-gradient(145deg, #f0f4ff 0%, #e8edf9 30%, #f2f6ff 60%, #eaf0fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity:0; transform: translateY(24px); }
            to { opacity:1; transform: translateY(0); }
        }
        .app-header {
            background: linear-gradient(135deg, #1a1f3a 0%, #1e3a5f 40%, #1d4ed8 100%);
            padding: 22px 28px;
            color: #eff6ff;
            position: relative;
            overflow: hidden;
        }
        .app-header::after {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(14,165,233,0.35) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 44px; height: 44px;
            background: rgba(14,165,233,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 1px solid rgba(14,165,233,0.4);
        }
        .app-header h1 { font-size: 1.1rem; font-weight: 700; }
        .subtitle { font-size: 0.7rem; opacity: 0.7; letter-spacing: 0.03em; }
        .badge {
            background: rgba(14,165,233,0.18);
            border: 1px solid rgba(14,165,233,0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #bae6fd;
        }
        .progress-section {
            padding: 16px 28px 8px;
            background: #fafbff;
            border-bottom: 1px solid var(--border);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .progress-info .respondidas { color: var(--primary); font-weight: 700; }
        .progress-bar-track {
            width: 100%;
            height: 8px;
            background: #e8edf9;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #2563eb, #0ea5e9, #38bdf8);
            transition: width 0.5s ease;
            width: 0%;
        }
        .main-content {
            padding: 24px 28px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .question-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 20px;
            width: fit-content;
            border: 1px solid rgba(37,99,235,0.3);
        }
        .question-indicator .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #0ea5e9;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot {
            0%,100% { transform: scale(1); opacity:1; }
            50% { transform: scale(1.6); opacity:0.5; }
        }
        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.6;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            list-style: none;
        }
        .option-item {
            display: flex;
            align-items: stretch;
            cursor: pointer;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: #fafbff;
            transition: all var(--transition);
            overflow: hidden;
        }
        .option-item:hover:not(.disabled) {
            border-color: #93c5fd;
            background: #eff6ff;
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
        .option-item:active:not(.disabled) { transform: scale(0.985); }
        .option-item.disabled { pointer-events: none; cursor: default; }
        .option-item.correct {
            border-color: var(--success-border) !important;
            background: var(--success-light) !important;
            box-shadow: 0 0 0 4px rgba(16,185,129,0.08);
        }
        .option-item.incorrect {
            border-color: var(--error-border) !important;
            background: var(--error-light) !important;
            box-shadow: 0 0 0 4px rgba(239,68,68,0.08);
        }
        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px; min-width: 48px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-secondary);
            background: #f0f4ff;
            border-right: 2px solid var(--border);
            transition: all var(--transition);
        }
        .option-item.correct .option-letter { background:#10b981; color:#fff; border-right-color:#10b981; }
        .option-item.incorrect .option-letter { background:#ef4444; color:#fff; border-right-color:#ef4444; }
        .option-text {
            padding: 13px 16px;
            flex: 1;
            font-size: 0.93rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.4;
            display: flex;
            align-items: center;
        }
        .option-item.correct .option-text,
        .option-item.incorrect .option-text { font-weight: 600; }
        .option-icon {
            display: none;
            align-items: center;
            justify-content: center;
            width: 40px; min-width: 40px;
            font-size: 1.3rem;
        }
        .option-item.correct .option-icon,
        .option-item.incorrect .option-icon { display: flex; }
        .option-item.correct .option-icon::after { content:'✓'; color:#34d399; font-weight:700; }
        .option-item.incorrect .option-icon::after { content:'✗'; color:#f87171; font-weight:700; }

        .justification-box {
            background: #f8faff;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            padding: 16px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        .justification-box.visible { display: block; }
        .just-label {
            font-weight: 700;
            color: var(--primary-dark);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.73rem;
            margin-bottom: 4px;
        }
        .nav-section {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 8px;
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .btn-prev { background:#f0f4ff; color:var(--text-secondary); border:1px solid #dbe0ee; }
        .btn-prev:hover { background:#e0e7f5; }
        .btn-prev:disabled { opacity:0.4; pointer-events:none; }
        .btn-next { background: var(--primary); color:#fff; box-shadow:0 2px 8px rgba(37,99,235,0.3); }
        .btn-next:hover { background: var(--primary-dark); }
        .btn-finish { background: linear-gradient(135deg,#059669,#047857); color:#fff; }
        .btn-restart { background:transparent; color:var(--primary); border:2px solid var(--primary); }
        .btn-restart:hover { background: var(--primary-light); }

        .results-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            gap: 18px;
            text-align: center;
            animation: fadeInUp 0.5s;
        }
        .results-screen.active { display: flex; }
        .results-circle {
            width: 140px; height: 140px;
            border-radius: 50%;
            background: conic-gradient(#10b981 0deg, #10b981 var(--pct), #e8edf9 var(--pct));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inner-circle {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text);
        }
        .results-summary { color: var(--text-secondary); line-height:1.6; }
        .results-summary strong { color: var(--text); }
        .results-emoji { font-size: 3rem; }
        @media (max-width:600px) {
            .app-container { border-radius: 16px; }
            .app-header { padding:16px 18px; }
            .main-content { padding:18px 16px; }
            .option-letter { width:38px; min-width:38px; }
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <div class="app-header">
        <div class="header-top">
            <div class="logo-area">
                <div class="logo-icon">🏫</div>
                <div>
                    <h1>IoT en Entornos Educativos</h1>
                    <span class="subtitle">Sensores · HVAC · Seguridad · STEM · Escalabilidad</span>
                </div>
            </div>
            <span class="badge">🔷 Nivel Técnico Avanzado</span>
        </div>
    </div>

    <div class="progress-section" id="progressSection">
        <div class="progress-info">
            <span>Progreso de la práctica</span>
            <span class="respondidas" id="respondidasCount">0 / 20 respondidas</span>
        </div>
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="question-indicator"><span class="dot"></span> <span id="qIndicatorText">Pregunta 1 de 20</span></div>
        <p class="question-text" id="questionText"></p>
        <ul class="options-list" id="optionsList"></ul>
        <div class="justification-box" id="justificationBox">
            <span class="just-label" id="justLabel">Justificación técnica</span>
            <span id="justText"></span>
        </div>
        <div class="nav-section">
            <button class="nav-btn btn-prev" id="btnPrev">← Anterior</button>
            <button class="nav-btn btn-finish" id="btnFinish">🏁 Finalizar</button>
            <button class="nav-btn btn-next" id="btnNext">Siguiente →</button>
        </div>
    </div>

    <div class="results-screen" id="resultsScreen">
        <div class="results-emoji" id="resultsEmoji">🎯</div>
        <div class="results-circle" id="resultsCircle">
            <div class="inner-circle" id="resultsPercentage">0%</div>
        </div>
        <div class="results-summary" id="resultsSummary"></div>
        <button class="nav-btn btn-restart" id="btnRestart">🔄 Volver a intentar (nuevo orden)</button>
    </div>
</div>

<script>
(function() {
    // Bloqueo de herramientas de inspección
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) { e.preventDefault(); return false; }
    });

    const questionsData = [
        {
            id:1,
            text:'Al planificar la infraestructura de red para dispositivos IoT en un campus extenso, ¿cuál es la razón técnica primordial para implementar redes segmentadas?',
            options:['Mejorar la seguridad al aislar el tráfico de los dispositivos.','Reducir la latencia general de la red Wi-Fi institucional.','Facilitar la configuración masiva de nuevos nodos de red.','Optimizar el consumo de batería de los sensores inalámbricos.','Permitir la compatibilidad entre distintos protocolos de red.'],
            correctIndex:0,
            justification:'La fuente recomienda redes separadas para mejorar la seguridad y el rendimiento. Aislar el tráfico IoT evita que vulnerabilidades en dispositivos periféricos comprometan la red administrativa principal.'
        },
        {
            id:2,
            text:'En el contexto de la gestión climática (HVAC), ¿cuál es el beneficio principal de que los termostatos inteligentes posean algoritmos de aprendizaje de patrones?',
            options:['Anticipar ajustes térmicos según el historial de ocupación.','Eliminar la necesidad de sensores de humedad ambientales.','Reducir el mantenimiento preventivo de los equipos físicos.','Permitir el control manual exclusivo desde una app móvil.','Garantizar una temperatura idéntica en todas las aulas.'],
            correctIndex:0,
            justification:'El material indica que estos sistemas aprenden patrones de uso para optimizar el funcionamiento. Esto permite una gestión proactiva en lugar de reactiva.'
        },
        {
            id:3,
            text:'¿Qué problema crítico de infraestructura busca evitar la integración fluida de sistemas IoT con la arquitectura tecnológica ya existente de la escuela?',
            options:['Creación de silos tecnológicos que operen de forma aislada.','Interferencia de radiofrecuencia entre sensores y routers.','Saturación del ancho de banda por cámaras de alta definición.','Incremento desmedido en los costos de licencias de software.','Desgaste acelerado de los actuadores en sistemas de riego.'],
            correctIndex:0,
            justification:'El texto enfatiza que evitar "silos" es fundamental para que todos los sistemas trabajen en conjunto y optimicen la eficiencia.'
        },
        {
            id:4,
            text:'Según el caso de éxito de las Escuelas Públicas de Cheshire, ¿cuál es el factor determinante para maximizar el retorno de inversión (ROI) en iluminación?',
            options:['Integrar sensores de ocupación con luminarias LED eficientes.','Instalar interruptores Wi-Fi en todas las áreas de la escuela.','Ajustar la temperatura de color para mejorar la concentración.','Implementar protocolos de apagado manual en horarios pico.','Centralizar el control solo en las oficinas administrativas.'],
            correctIndex:0,
            justification:'El ahorro de $390,000 anuales se logró mediante la integración de luces LED eficientes con sensores IoT. Sin la combinación de ambas tecnologías, el ahorro sería significativamente menor.'
        },
        {
            id:5,
            text:'Desde una perspectiva de seguridad de datos, ¿cuál es la función crítica de implementar la autenticación de dos factores en las plataformas de gestión IoT?',
            options:['Mitigar el riesgo de accesos no autorizados al sistema central.','Aumentar la velocidad de transmisión de datos cifrados de video.','Validar la integridad física de los sensores de apertura de puertas.','Facilitar el registro automático de entrada y salida de alumnos.','Reducir la carga de procesamiento de los servidores de la escuela.'],
            correctIndex:0,
            justification:'La fuente menciona la autenticación de dos factores como una medida de seguridad robusta para proteger la red escolar de ciberataques.'
        },
        {
            id:6,
            text:'En un sistema de seguridad perimetral, ¿cuál es la ventaja operativa de los sensores de apertura frente a las cámaras de vigilancia tradicionales?',
            options:['Detectar intentos de intrusión en puntos ciegos de grabación.','Grabar audio bidireccional en zonas sensibles del campus.','Identificar la identidad biométrica de las personas presentes.','Ofrecer visión nocturna en condiciones de oscuridad total.','Controlar la temperatura ambiente en laboratorios y oficinas.'],
            correctIndex:0,
            justification:'Los sensores en puertas y ventanas detectan aperturas no autorizadas en áreas específicas, actuando como una capa adicional de seguridad que no depende de la visibilidad visual.'
        },
        {
            id:7,
            text:'En el proyecto del invernadero automatizado, ¿qué papel cumplen los actuadores en el ciclo de control de lazo cerrado?',
            options:['Ejecutar acciones físicas basadas en los datos de los sensores.','Recolectar información sobre la humedad del suelo en tiempo real.','Procesar el código de programación dentro del kit Arduino IoT.','Visualizar las métricas de crecimiento en el panel de control.','Alimentar el sistema eléctrico mediante paneles solares externos.'],
            correctIndex:0,
            justification:'El texto explica que los datos alimentan un sistema central que activa actuadores, como bombas de agua o ventiladores. El actuador es el componente que realiza el trabajo físico tras la decisión lógica.'
        },
        {
            id:8,
            text:'¿Cuál es el impacto psicopedagógico directo de ajustar la intensidad lumínica y la temperatura de color en las aulas?',
            options:['Mejorar los niveles de concentración y bienestar de los alumnos.','Fomentar el uso de dispositivos móviles en actividades STEM.','Facilitar la visualización de proyecciones en pantallas digitales.','Reducir el cansancio visual durante los exámenes de memoria.','Automatizar la transición entre las clases teóricas y prácticas.'],
            correctIndex:0,
            justification:'El material afirma que la capacidad de ajustar estos parámetros influye positivamente en la concentración y el bienestar de estudiantes y docentes.'
        },
        {
            id:9,
            text:'Al evaluar las necesidades específicas antes de implementar IoT, ¿cuál es el primer paso recomendado para asegurar la viabilidad del proyecto?',
            options:['Realizar un diagnóstico exhaustivo de las áreas prioritarias de gasto.','Seleccionar la marca de dispositivos inalámbricos más económica.','Contratar personal externo para el mantenimiento de los sensores.','Instalar repetidores Wi-Fi en todos los pasillos y áreas comunes.','Migrar todos los registros de la escuela a una base de datos pública.'],
            correctIndex:0,
            justification:'La fuente establece que el paso 1 es realizar un diagnóstico exhaustivo para definir objetivos, ya sea ahorro, seguridad o confort.'
        },
        {
            id:10,
            text:'¿Cómo contribuye el uso de cerraduras RFID al análisis de incidentes de seguridad dentro de la escuela?',
            options:['Proporcionando un historial de accesos detallado y automatizado.','Bloqueando automáticamente todas las salidas en caso de incendio.','Alertando a la policía local mediante reconocimiento de voz.','Eliminando la necesidad de capacitación para el personal escolar.','Detectando el movimiento de personas en pasillos sin iluminación.'],
            correctIndex:0,
            justification:'Estas cerraduras guardan registros de entrada y salida automáticamente, proporcionando un historial útil en caso de incidentes.'
        },
        {
            id:11,
            text:'¿Cuál es el desafío principal que enfrenta el personal de mantenimiento al adoptar tecnologías IoT, según el material?',
            options:['Interpretar correctamente los datos generados para optimizar el sistema.','Reemplazar toda la infraestructura de cableado por fibra óptica.','Desarrollar aplicaciones móviles personalizadas para cada usuario.','Vigilar físicamente los sensores para evitar actos de vandalismo.','Configurar los protocolos de cifrado en cada dispositivo individual.'],
            correctIndex:0,
            justification:'La capacitación debe centrarse en el uso de plataformas y en la interpretación de los datos para aprovechar el potencial de los sistemas.'
        },
        {
            id:12,
            text:'En la visión de futuro de las escuelas inteligentes, ¿qué permitirá la recopilación de datos en tiempo real sobre el comportamiento físico de los estudiantes?',
            options:['Adaptar la pedagogía y los recursos a necesidades individuales.','Reemplazar a los docentes por sistemas de tutoría automatizados.','Sancionar automáticamente a los estudiantes que salgan del aula.','Reducir el tamaño de las instalaciones físicas de las escuelas.','Monetizar los datos de comportamiento con empresas de software.'],
            correctIndex:0,
            justification:'El futuro del IoT permitirá adaptar los recursos y la pedagogía a las necesidades individuales basándose en datos reales de comportamiento.'
        },
        {
            id:13,
            text:'¿Por qué se considera que el proyecto del invernadero es una plataforma educativa STEM integral?',
            options:['Integra programación, electrónica y análisis de datos reales.','Permite a los estudiantes trabajar sin supervisión del docente.','Utiliza exclusivamente tecnologías de código abierto y gratuito.','Automatiza la calificación de los estudiantes en ciencias naturales.','Sustituye las clases teóricas por el trabajo manual en el campo.'],
            correctIndex:0,
            justification:'El proyecto enseña habilidades en Ciencia, Tecnología, Ingeniería y Matemáticas (STEM) mediante la aplicación de codificación, electrónica y resolución de problemas del mundo real.'
        },
        {
            id:14,
            text:'Ante una falla en la conectividad de un sensor de humedad en el invernadero, ¿cuál sería el diagnóstico técnico más probable según la infraestructura descrita?',
            options:['Problemas de cobertura en la red Wi-Fi en la zona del proyecto.','Interrupción del suministro eléctrico en la bomba de riego.','Falta de actualización del software de gestión administrativa.','Saturación de la memoria interna en el sensor de temperatura.','Error en la base de datos de registros de entrada del personal.'],
            correctIndex:0,
            justification:'El paso 3 para implementar IoT destaca que una red Wi-Fi robusta con cobertura suficiente es fundamental para el funcionamiento de los equipos.'
        },
        {
            id:15,
            text:'¿Cuál es la ventaja estratégica de una plataforma de gestión centralizada sobre el control individual de dispositivos?',
            options:['Facilitar la supervisión y automatización de funciones globales.','Reducir la cantidad de energía consumida por cada interruptor.','Permitir que cada docente configure su propia red de sensores.','Eliminar la necesidad de realizar auditorías de seguridad periódicas.','Incrementar la velocidad de respuesta de los actuadores mecánicos.'],
            correctIndex:0,
            justification:'Una plataforma centralizada permite controlar todos los dispositivos desde un solo lugar, facilitando la recolección de datos y la automatización.'
        },
        {
            id:16,
            text:'¿Cómo influye el control automatizado de la climatización en la reducción de costos operativos a largo plazo?',
            options:['Minimizando el uso de energía durante periodos de inactividad.','Evitando la contratación de técnicos para reparar los sistemas HVAC.','Aumentando la vida útil de las baterías de los sensores térmicos.','Sustituyendo el uso de gas natural por energía eléctrica de red.','Permitiendo que los estudiantes ajusten el clima desde sus pupitres.'],
            correctIndex:0,
            justification:'La automatización reduce el uso de calefacción o aire acondicionado durante noches, fines de semana o vacaciones, eliminando el desperdicio.'
        },
        {
            id:17,
            text:'En términos de seguridad proactiva, ¿qué capacidad de las cámaras Wi-Fi es más valorada por los administradores escolares?',
            options:['Enviar alertas instantáneas ante cualquier actividad inusual detectada.','Almacenar grabaciones en alta definición durante varios años lectivos.','Funcionar de manera autónoma sin necesidad de conexión a internet.','Proyectar imágenes de seguridad en las pantallas de todos los salones.','Identificar automáticamente el estado de ánimo de los estudiantes.'],
            correctIndex:0,
            justification:'La capacidad de enviar alertas en tiempo real a dispositivos móviles permite una respuesta rápida ante amenazas.'
        },
        {
            id:18,
            text:'¿Qué característica técnica deben poseer los dispositivos IoT para garantizar que la solución sea escalable?',
            options:['Capacidad para comunicarse con una plataforma central común.','Requerir un hardware propietario específico para cada aula nueva.','Funcionar exclusivamente con cables para evitar interferencias Wi-Fi.','Poseer una interfaz de usuario diferente para cada tipo de sensor.','Limitar la cantidad de datos que pueden enviar al sistema central.'],
            correctIndex:0,
            justification:'El material sugiere elegir dispositivos fáciles de integrar, escalables y que puedan comunicarse entre sí y con una plataforma central.'
        },
        {
            id:19,
            text:'¿Cuál es el beneficio indirecto de la reducción de la intervención manual en la gestión de recursos escolares?',
            options:['Liberar fondos para programas educativos o mejoras edilicias.','Reducir la cantidad de personal docente necesario en la escuela.','Eliminar por completo los errores humanos en la toma de datos.','Aumentar el tiempo de recreo de los estudiantes en el campus.','Facilitar la promoción automática de los empleados administrativos.'],
            correctIndex:0,
            justification:'Al optimizar el uso de recursos y reducir la necesidad de intervención manual, se liberan fondos que pueden ser redirigidos a la misión principal: la educación.'
        },
        {
            id:20,
            text:'Al diagnosticar un ambiente de aprendizaje poco confortable a pesar de tener IoT, ¿qué factor debería revisarse primero según la integración de sistemas?',
            options:['Sincronización entre sensores de humedad y sistemas de ventilación.','Cantidad de dispositivos conectados a la red Wi-Fi de invitados.','Marca de los interruptores inteligentes instalados en los baños.','Frecuencia de las auditorías de seguridad realizadas por el personal.','Nivel de brillo de las cámaras de seguridad en los pasillos externos.'],
            correctIndex:0,
            justification:'El confort óptimo depende del monitoreo constante de temperatura y humedad interconectados a los sistemas HVAC. Una falta de sincronización impediría los ajustes automáticos necesarios.'
        }
    ];

    const TOTAL = questionsData.length;
    let shuffledQuestions = [];
    let userAnswers = {};
    let currentIndex = 0;
    let quizFinished = false;

    const main = document.getElementById('mainContent');
    const results = document.getElementById('resultsScreen');
    const progSec = document.getElementById('progressSection');
    const qText = document.getElementById('questionText');
    const optList = document.getElementById('optionsList');
    const justBox = document.getElementById('justificationBox');
    const justLabel = document.getElementById('justLabel');
    const justText = document.getElementById('justText');
    const qInd = document.getElementById('qIndicatorText');
    const respCount = document.getElementById('respondidasCount');
    const progBar = document.getElementById('progressBarFill');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnFinish = document.getElementById('btnFinish');
    const btnRestart = document.getElementById('btnRestart');
    const resCircle = document.getElementById('resultsCircle');
    const resPct = document.getElementById('resultsPercentage');
    const resSummary = document.getElementById('resultsSummary');
    const resEmoji = document.getElementById('resultsEmoji');

    function shuffle(arr) {
        const a = arr.slice();
        for (let i=a.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [a[i],a[j]] = [a[j],a[i]];
        }
        return a;
    }

    function prepareQuestions() {
        const shuffled = shuffle(questionsData);
        return shuffled.map(q => {
            const origOpts = q.options.slice();
            const correctText = origOpts[q.correctIndex];
            const idxs = origOpts.map((_,i)=>i);
            const shuffledIdxs = shuffle(idxs);
            const newOpts = shuffledIdxs.map(i=>origOpts[i]);
            return {
                id:q.id,
                text:q.text,
                options:newOpts,
                correctIndex:newOpts.indexOf(correctText),
                justification:q.justification
            };
        });
    }

    function initQuiz() {
        shuffledQuestions = prepareQuestions();
        userAnswers = {};
        currentIndex = 0;
        quizFinished = false;
        results.classList.remove('active');
        main.style.display = 'flex';
        progSec.style.display = 'block';
        updateProgress();
        renderQuestion(currentIndex);
    }

    function updateProgress() {
        const answered = Object.keys(userAnswers).length;
        respCount.textContent = answered + ' / ' + TOTAL + ' respondidas';
        progBar.style.width = Math.round((answered/TOTAL)*100) + '%';
        qInd.textContent = 'Pregunta ' + (currentIndex+1) + ' de ' + TOTAL;
    }

    function renderQuestion(idx) {
        if (idx<0 || idx>=TOTAL) return;
        currentIndex = idx;
        const q = shuffledQuestions[idx];
        const answered = userAnswers.hasOwnProperty(q.id);
        const ans = userAnswers[q.id] || null;

        qText.innerHTML = q.text;
        optList.innerHTML = '';
        const letters = ['A','B','C','D','E'];

        q.options.forEach((opt,i) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerHTML = `
                <span class="option-letter">${letters[i]}</span>
                <span class="option-text">${opt}</span>
                <span class="option-icon"></span>
            `;
            if (answered) {
                li.classList.add('disabled');
                if (i === q.correctIndex) li.classList.add('correct');
                if (i === ans.selectedIndex && i !== q.correctIndex) li.classList.add('incorrect');
            } else {
                li.addEventListener('click', ()=> handleSelect(q,i));
            }
            optList.appendChild(li);
        });

        if (answered) {
            justBox.classList.add('visible');
            justLabel.textContent = ans.isCorrect ? '✅ Correcto – Justificación técnica' : '❌ Incorrecto – Justificación técnica';
            justText.textContent = q.justification;
        } else {
            justBox.classList.remove('visible');
            justLabel.textContent = 'Justificación técnica';
            justText.textContent = '';
        }

        btnPrev.disabled = (currentIndex === 0);
        btnNext.textContent = (currentIndex === TOTAL-1) ? 'Finalizar →' : 'Siguiente →';
        updateProgress();
    }

    function handleSelect(q, idx) {
        if (userAnswers.hasOwnProperty(q.id)) return;
        userAnswers[q.id] = { selectedIndex: idx, isCorrect: idx === q.correctIndex };
        renderQuestion(currentIndex);
    }

    function goNext() {
        if (currentIndex < TOTAL-1) renderQuestion(currentIndex+1);
        else finishQuiz();
    }
    function goPrev() { if (currentIndex>0) renderQuestion(currentIndex-1); }

    function finishQuiz() {
        quizFinished = true;
        const answered = Object.keys(userAnswers).length;
        const correct = Object.values(userAnswers).filter(a=>a.isCorrect).length;
        const pct = answered ? Math.round((correct/TOTAL)*100) : 0;

        main.style.display = 'none';
        progSec.style.display = 'none';
        results.classList.add('active');

        resCircle.style.setProperty('--pct', pct*3.6+'deg');
        resPct.textContent = pct+'%';
        let msg = '';
        if (pct>=90) msg = '🏆 ¡Excelente! Dominas la implementación de IoT en entornos educativos.';
        else if (pct>=70) msg = '👍 Muy buen trabajo. Sólida comprensión de sensores, actuadores y plataformas centralizadas.';
        else if (pct>=50) msg = '📚 Vas por buen camino. Repasa las justificaciones para afianzar los conceptos de IoT escolar.';
        else msg = '💪 Sigue practicando. Cada error es una oportunidad para dominar la tecnología educativa.';
        resEmoji.textContent = pct>=90 ? '🏆' : (pct>=70 ? '👍' : (pct>=50 ? '📚' : '💪'));
        resSummary.innerHTML = `<strong>${correct} aciertos</strong> de ${TOTAL} preguntas.<br>Respondidas ${answered} de ${TOTAL}.<br>${msg}`;
    }

    btnNext.addEventListener('click', goNext);
    btnPrev.addEventListener('click', goPrev);
    btnFinish.addEventListener('click', ()=>{
        if (Object.keys(userAnswers).length===0 && !confirm('No has respondido ninguna pregunta. ¿Finalizar igual?')) return;
        finishQuiz();
    });
    btnRestart.addEventListener('click', initQuiz);

    document.addEventListener('keydown', function(e) {
        if (quizFinished) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
        const q = shuffledQuestions[currentIndex];
        if (!userAnswers.hasOwnProperty(q.id)) {
            const map = {a:0,b:1,c:2,d:3,e:4};
            const k = e.key.toLowerCase();
            if (map[k] !== undefined && map[k] < q.options.length) {
                e.preventDefault();
                handleSelect(q, map[k]);
            }
        }
    });

    initQuiz();
})();
</script>
</body>
</html>
